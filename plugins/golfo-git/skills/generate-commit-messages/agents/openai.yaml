interface:
  display_name: "Generate Commit Messages"
  short_description: "Generate commit messages or prepare a commit message"
  default_prompt: "Generate a commit message for use in git commit following the generate-commit-messages skill: an imperative title, a type prefix only when the repository's commitlint requires it, «Closes #<n>» at the end only when the change implements a GitHub issue the user named, technical names wrapped in «...», and a detailed description separated by a blank line."
