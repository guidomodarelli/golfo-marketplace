name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Only pull requests cancel an older run: every push to main has to finish, because it is the
  # full run that backs up the path filter.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which heavy areas this run needs (scripts/detect-test-areas.js). Pull requests run the
  # agent-ready-setup suites only when they touch that skill, its tooling or a golfo-kit manifest
  # beyond its version; a push to main and workflow_dispatch always run everything. If the detection
  # cannot compare, it asks for every area instead of skipping one.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent_ready: ${{ steps.detect.outputs.agent_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/detect-test-areas.js "${BASE_SHA:-HEAD}"

  shell:
    name: Shell suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate portable plugin packages (Hermes)
        run: pnpm run validate-portable-plugins
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      # The list of suites lives in package.json (test:shell), so CI and local runs never drift.
      - name: Fast bats suites
        run: pnpm run test:shell
      - run: pnpm run compat:validate
      - run: pnpm run test:review-fix-loop
      - run: pnpm run test:sibling-worktree
      - name: Skill coverage engine (temporary git repositories)
        run: pnpm run test:skill-coverage
      - name: agent-ready npm launcher (@golfo/agent-ready)
        run: pnpm run test:agent-ready-launcher
      - name: jira-ticket helper (pytest)
        run: |
          python3 -m pip install --user pytest
          pnpm run test:jira-ticket
      - name: Install Chromium for the user-manual browser suite
        run: pnpm exec playwright-core install --with-deps chromium
      - name: User manual suites (validators and real browser)
        run: pnpm run test:user-manual

  agent-ready-linux:
    name: Agent Ready (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.agent_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      # The list of suites lives in package.json (test:agent-ready).
      - name: Agent Ready suites
        run: pnpm run test:agent-ready

  # agent-ready-setup runs on Linux, macOS and Windows, and what breaks differs on
  # each: line endings, code pages and hard-link views on Windows; Bash 3.2 and BSD
  # tools on macOS. The Linux run of these suites lives in the jobs around this one.
  agent-ready-cross-platform:
    name: Agent Ready (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.agent_ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Git Bash pays for every process it starts, and these suites start thousands, so
          # on Windows the same suites take about four times as long as on macOS, and one run
          # can be twice as slow as another. Five shards of 15 to 19 minutes on a fast runner
          # (about 40 on a slow one) keep each one under the 45-minute limit of the job.
          # bootstrap.bats would not fit in its time budget at all.
          - os: windows-latest
            python: "3.13"
            shard: 1/5
            suites: agent-ready-blocks.bats agent-ready-config.bats agent-ready-pack-examples.bats agent-ready-reviews.bats agent-ready-conflicts.bats
          - os: windows-latest
            python: "3.13"
            shard: 2/5
            suites: agent-ready-state.bats agent-ready-updates.bats agent-ready-ci.bats
          - os: windows-latest
            python: "3.13"
            shard: 3/5
            suites: agent-ready-golfo-kit.bats agent-ready-detection.bats agent-ready-pack-clis.bats
          - os: windows-latest
            python: "3.13"
            shard: 4/5
            suites: agent-ready-packs.bats agent-ready-pack-tools.bats
          - os: windows-latest
            python: "3.13"
            shard: 5/5
            suites: agent-ready-cli.bats agent-ready-workspaces.bats agent-ready-pack-scripts.bats
          - os: macos-latest
            python: "3.13"
            suites: agent-ready-state.bats agent-ready-detection.bats agent-ready-packs.bats agent-ready-updates.bats agent-ready-config.bats agent-ready-cli.bats agent-ready-reviews.bats agent-ready-golfo-kit.bats agent-ready-conflicts.bats agent-ready-pack-tools.bats agent-ready-pack-clis.bats agent-ready-pack-scripts.bats agent-ready-pack-examples.bats agent-ready-blocks.bats agent-ready-workspaces.bats agent-ready-ci.bats merge-instructions.bats bootstrap.bats
          # The python3 that ships with the macOS command line tools. Browser tools
          # need 3.11+ (references/browser-setup.md), so bootstrap.bats stays on 3.13.
          - os: macos-latest
            python: "3.9"
            suites: agent-ready-state.bats agent-ready-detection.bats agent-ready-packs.bats agent-ready-updates.bats agent-ready-config.bats agent-ready-cli.bats agent-ready-reviews.bats agent-ready-golfo-kit.bats agent-ready-conflicts.bats agent-ready-pack-tools.bats agent-ready-pack-clis.bats agent-ready-pack-scripts.bats agent-ready-pack-examples.bats agent-ready-blocks.bats agent-ready-workspaces.bats agent-ready-ci.bats
    defaults:
      run:
        shell: bash
    steps:
      # Defender scans every file the tests write in their temporary repositories. The
      # runner is thrown away after the job, so excluding these directories costs nothing.
      - name: Keep Windows Defender out of the test directories
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:TEMP, $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE -ErrorAction Stop
            Write-Output "Defender exclusions: $((Get-MpPreference).ExclusionPath -join ', ')"
          } catch {
            Write-Output "::warning::Defender exclusions were not applied: $($_.Exception.Message)"
          }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - name: Use the Bash that ships with macOS (3.2)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Agent Ready suites
        working-directory: plugins/golfo-kit/skills/agent-ready-setup/tests
        run: |
          bash --version | head -n 1
          LC_ALL=C.UTF-8 pnpm exec bats ${{ matrix.suites }}

  bootstrap:
    name: Agent Ready bootstrap (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.agent_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install GNU parallel for bats --jobs
        run: sudo apt-get install -y --no-install-recommends parallel
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Run this shard of bootstrap.bats
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 3
        run: |
          suite=plugins/golfo-kit/skills/agent-ready-setup/tests/bootstrap.bats
          # Every SHARD_COUNT-th test name goes to this shard; names are unique.
          pattern=$(grep -oP '^@test "\K[^"]+' "$suite" \
            | awk -v shard="$SHARD" -v count="$SHARD_COUNT" '(NR - 1) % count == shard - 1' \
            | sed -e 's/[][\.*^$+?(){}|]/\\&/g' -e 's/.*/^&$/' \
            | paste -sd '|')
          LC_ALL=C.UTF-8 BATS_TEST_TIMEOUT=120 node_modules/.bin/bats \
            --jobs "$(nproc)" --filter "$pattern" "$suite"

  browser:
    name: Browser registration
    needs: changes
    if: needs.changes.outputs.agent_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:browser-tests
      - run: pnpm run test:browser

  # The check that reports for the whole workflow. A skipped job only passes when the detection ran
  # and said its area was not needed: a failed or cancelled detection never turns into a green run.
  tests:
    name: Tests
    if: always()
    needs: [changes, shell, agent-ready-linux, agent-ready-cross-platform, bootstrap, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite that had to run to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AGENT_READY_NEEDED: ${{ needs.changes.outputs.agent_ready }}
          SHELL_RESULT: ${{ needs.shell.result }}
          AGENT_READY_RESULTS: >-
            agent-ready-linux=${{ needs.agent-ready-linux.result }}
            agent-ready-cross-platform=${{ needs.agent-ready-cross-platform.result }}
            bootstrap=${{ needs.bootstrap.result }}
            browser=${{ needs.browser.result }}
        run: |
          failed=0
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::Detect changed areas ended with '$CHANGES_RESULT'."
            failed=1
          fi
          if [[ "$SHELL_RESULT" != success ]]; then
            echo "::error::Shell suites ended with '$SHELL_RESULT'."
            failed=1
          fi
          expected=skipped
          if [[ "$AGENT_READY_NEEDED" == true ]]; then expected=success; fi
          for entry in $AGENT_READY_RESULTS; do
            if [[ "${entry#*=}" != "$expected" ]]; then
              echo "::error::${entry%%=*} ended with '${entry#*=}' (expected '$expected', agent_ready=$AGENT_READY_NEEDED)."
              failed=1
            fi
          done
          exit "$failed"
