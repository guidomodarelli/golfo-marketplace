name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate portable plugin packages (Hermes)
        run: pnpm run validate-portable-plugins
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Fast bats suites
        run: >-
          LC_ALL=C.UTF-8 BATS_TEST_TIMEOUT=30 node_modules/.bin/bats
          tests/create-version.bats
          tests/check-version-bump.bats
          tests/validate-compatibility-report.bats
          tests/validate-portable-plugins.bats
          plugins/golfo-kit/skills/codex-autofix-loop/tests/wait-for-pr-event.bats
          plugins/golfo-kit/skills/codex-comment-closeout/tests/closeout.bats
          plugins/golfo-kit/skills/user-manual/tests/check-design-tokens.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/merge-instructions.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-state.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-detection.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-packs.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-updates.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-config.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-cli.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-reviews.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-golfo-kit.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-conflicts.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-pack-tools.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-pack-clis.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-pack-scripts.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-pack-examples.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-blocks.bats
          plugins/golfo-kit/skills/agent-ready-setup/tests/agent-ready-ci.bats
          skill-eval-runner/tests/run-evals-env-contract.bats
          skill-eval-runner/tests/run-evals-assertions.bats
          skill-eval-runner/tests/install.bats
      - run: pnpm run compat:validate
      - run: pnpm run test:review-fix-loop
      - run: pnpm run test:sibling-worktree
      - name: Skill coverage engine (temporary git repositories)
        run: pnpm run test:skill-coverage
      - name: agent-ready npm launcher (@golfo/agent-ready)
        run: pnpm run test:agent-ready-launcher
      - name: jira-ticket helper (pytest)
        run: |
          python3 -m pip install --user pytest
          pnpm run test:jira-ticket
      - name: Install Chromium for the user-manual browser suite
        run: pnpm exec playwright-core install --with-deps chromium
      - name: User manual suites (validators and real browser)
        run: pnpm run test:user-manual

  # agent-ready-setup runs on Linux, macOS and Windows, and what breaks differs on
  # each: line endings, code pages and hard-link views on Windows; Bash 3.2 and BSD
  # tools on macOS. The Linux run of these suites lives in the jobs around this one.
  agent-ready-cross-platform:
    name: Agent Ready (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Git Bash pays for every process it starts, and these suites start thousands, so
          # on Windows the same suites take about four times as long as on macOS. Three
          # shards of similar length (about 34, 39 and 36 minutes) keep each one under the
          # 45-minute limit of the job. bootstrap.bats would not fit in its time budget at all.
          - os: windows-latest
            python: "3.13"
            shard: 1/3
            suites: agent-ready-state.bats agent-ready-config.bats agent-ready-pack-examples.bats agent-ready-blocks.bats
          - os: windows-latest
            python: "3.13"
            shard: 2/3
            suites: agent-ready-updates.bats agent-ready-detection.bats agent-ready-reviews.bats agent-ready-conflicts.bats agent-ready-pack-clis.bats agent-ready-pack-tools.bats agent-ready-ci.bats
          - os: windows-latest
            python: "3.13"
            shard: 3/3
            suites: agent-ready-packs.bats agent-ready-cli.bats agent-ready-golfo-kit.bats agent-ready-pack-scripts.bats
          - os: macos-latest
            python: "3.13"
            suites: agent-ready-state.bats agent-ready-detection.bats agent-ready-packs.bats agent-ready-updates.bats agent-ready-config.bats agent-ready-cli.bats agent-ready-reviews.bats agent-ready-golfo-kit.bats agent-ready-conflicts.bats agent-ready-pack-tools.bats agent-ready-pack-clis.bats agent-ready-pack-scripts.bats agent-ready-pack-examples.bats agent-ready-blocks.bats agent-ready-ci.bats merge-instructions.bats bootstrap.bats
          # The python3 that ships with the macOS command line tools. Browser tools
          # need 3.11+ (references/browser-setup.md), so bootstrap.bats stays on 3.13.
          - os: macos-latest
            python: "3.9"
            suites: agent-ready-state.bats agent-ready-detection.bats agent-ready-packs.bats agent-ready-updates.bats agent-ready-config.bats agent-ready-cli.bats agent-ready-reviews.bats agent-ready-golfo-kit.bats agent-ready-conflicts.bats agent-ready-pack-tools.bats agent-ready-pack-clis.bats agent-ready-pack-scripts.bats agent-ready-pack-examples.bats agent-ready-blocks.bats agent-ready-ci.bats
    defaults:
      run:
        shell: bash
    steps:
      # Defender scans every file the tests write in their temporary repositories. The
      # runner is thrown away after the job, so excluding these directories costs nothing.
      - name: Keep Windows Defender out of the test directories
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:TEMP, $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE -ErrorAction Stop
            Write-Output "Defender exclusions: $((Get-MpPreference).ExclusionPath -join ', ')"
          } catch {
            Write-Output "::warning::Defender exclusions were not applied: $($_.Exception.Message)"
          }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - name: Use the Bash that ships with macOS (3.2)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Agent Ready suites
        working-directory: plugins/golfo-kit/skills/agent-ready-setup/tests
        run: |
          bash --version | head -n 1
          LC_ALL=C.UTF-8 pnpm exec bats ${{ matrix.suites }}

  bootstrap:
    name: Agent Ready bootstrap (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install GNU parallel for bats --jobs
        run: sudo apt-get install -y --no-install-recommends parallel
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Run this shard of bootstrap.bats
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 3
        run: |
          suite=plugins/golfo-kit/skills/agent-ready-setup/tests/bootstrap.bats
          # Every SHARD_COUNT-th test name goes to this shard; names are unique.
          pattern=$(grep -oP '^@test "\K[^"]+' "$suite" \
            | awk -v shard="$SHARD" -v count="$SHARD_COUNT" '(NR - 1) % count == shard - 1' \
            | sed -e 's/[][\.*^$+?(){}|]/\\&/g' -e 's/.*/^&$/' \
            | paste -sd '|')
          LC_ALL=C.UTF-8 BATS_TEST_TIMEOUT=120 node_modules/.bin/bats \
            --jobs "$(nproc)" --filter "$pattern" "$suite"

  browser:
    name: Browser registration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:browser-tests
      - run: pnpm run test:browser

  tests:
    name: Tests
    if: always()
    needs: [shell, agent-ready-cross-platform, bootstrap, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite to pass
        run: |
          [[ "${{ needs.shell.result }}" == success ]]
          [[ "${{ needs.agent-ready-cross-platform.result }}" == success ]]
          [[ "${{ needs.bootstrap.result }}" == success ]]
          [[ "${{ needs.browser.result }}" == success ]]
